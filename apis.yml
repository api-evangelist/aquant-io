aid: aquant-io
name: Aquant
description: >-
  Aquant is an agentic AI platform purpose-built for servicing complex equipment,
  used by manufacturers and service organizations across industrial equipment, medical
  devices, food equipment, high-tech and electronics, printing, and energy. The platform
  lets teams deploy specialized service AI agents through Agent Studio and a prebuilt
  Agent Library, and adds Voice AI (Roger) and Vision AI so field technicians, call-center
  agents, customer self-service, and service leaders get expert-level guidance across the
  full service lifecycle from diagnosis to resolution. Aquant integrates with existing CRM
  and field-service systems and continuously learns from an organization's institutional
  service knowledge to drive service revenue, scale service teams, accelerate onboarding,
  and increase remote resolution rates. Aquant is a portfolio company of Lightspeed Venture
  Partners. It does not publish a public developer portal or OpenAPI-described API; platform
  API access is delivered to enterprise customers, so this profile captures the company's
  identity, security/compliance posture, and public web properties.
